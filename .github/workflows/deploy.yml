name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy_ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en instancia EC2 vía SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
        run: |
          # Configurar el directorio SSH y arrancar el agente
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval $(ssh-agent -s)
          
          # Añadir la llave privada al agente
          echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
          
          # Escanear el host para evitar el prompt de confirmación
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Conexión SSH y ejecución de comandos
          ssh $EC2_USER@$EC2_HOST "
            cd $EC2_PROJECT_PATH &&
            echo 'Actualizando código...' &&
            git pull origin main &&
            echo 'Reconstruyendo contenedores...' &&
            docker compose down &&
            docker compose up -d --build &&
            echo 'Limpiando imágenes...' &&
            docker image prune -f &&
            echo 'Despliegue terminado.'
          "